[project]
name = "eprofile-calibration"
version = "2.0.0"
description = "Rayleigh and liquid-cloud calibration for automated lidars and ceilometers (E-PROFILE)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "E-PROFILE", email = "contact@e-profile.eu" }]
keywords = ["lidar", "ceilometer", "calibration", "rayleigh", "cloud", "atmospheric", "remote sensing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "netCDF4>=1.5",
    "xarray>=2022.3",   # CAMS model-level reading (water-vapor correction / CAMS molecular profile)
    "matplotlib>=3.4",  # per-night diagnostic PNGs (calibration/plotting.py, daily operational run)
]

[project.optional-dependencies]
# Static monitoring dashboard (scripts/build_dashboard.py -> monitoring/). Pure-Python,
# pip-only deps; no server or database process is needed to view the generated site.
dashboard = ["plotly>=5.20", "jinja2>=3.0", "pandas>=1.3"]
# CAMS auto-download from the ADS. cfgrib pulls the eccodes wheel (binary library
# bundled, incl. Windows), so the GRIB->netCDF conversion runs in pure Python — no conda.
download = ["cdsapi>=0.7.0", "cfgrib>=0.9.10"]
# Cloudnet target classification (scripts/run_network_calibration.py --classify). Both come from
# git: ceiloclass is not on PyPI, and it needs ceilopyter's `ceiloclass` branch (top-level `Ceilo`),
# NOT the PyPI/mirror release (which only exposes the `ceilo` submodule) -- so pin the branch here.
# (Installs atmoslib + cloudnet-api-client transitively.)
classify = [
    "ceilopyter @ git+https://github.com/actris-cloudnet/ceilopyter.git@ceiloclass",
    "ceiloclass @ git+https://github.com/actris-cloudnet/ceiloclass",
]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "mypy>=1.0", "ruff>=0.1"]

[project.scripts]
eprofile-calibration = "calibration.main:main"

[project.urls]
Homepage = "https://e-profile.eu"

# ---------------------------------------------------------------------------
# Build backend (uv-compatible). Install with:  uv pip install -e .   (matplotlib is a core dep now)
# ---------------------------------------------------------------------------
[tool.hatch.metadata]
allow-direct-references = true   # the classify extra pins ceiloclass/ceilopyter via git

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calibration"]

[tool.hatch.build.targets.sdist]
include = ["calibration", "tests", "README.md"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "NPY",   # NumPy-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument (needed for dataclass defaults)
]

[tool.ruff.isort]
known-first-party = ["calibration"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "netCDF4.*",
    "scipy.*",
    "matplotlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is opt-in (run `pytest --cov=calibration`) so the suite runs without pytest-cov.
addopts = "-v"
# The dashboard browser tier drives a real Chromium and needs a built site; it skips itself when
# either is missing, and `-m "not browser"` excludes it outright.
markers = ["browser: headless-browser dashboard tests (need playwright + ALC_SITE_DIR)"]
